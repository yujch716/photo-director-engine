<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Director API Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="logo">Photo Director API Test</div>
    <nav>
      <button class="active" data-page="yolo">YOLO Detection</button>
      <button data-page="nima">NIMA Score</button>
      <button data-page="samp">SAMP Score</button>
      <button data-page="kakao-map">Kakao Map</button>
      <button data-page="captures">Drone</button>
    </nav>
  </aside>

  <main id="main">
    <section class="page active" id="page-yolo">
      <h2>YOLO Detection Test</h2>

      <div class="toolbar">
        <label class="upload-label">
          Select Image
          <input id="yolo-input" type="file" accept="image/*" hidden />
        </label>
        <span class="file-name" id="yolo-file-name"></span>
      </div>

      <p class="status" id="yolo-status"></p>
      <div class="error" id="yolo-error"></div>

      <div class="result-grid" id="yolo-result">
        <div class="panel">
          <h3>Detected Image</h3>
          <div class="image-frame">
            <canvas id="yolo-canvas" style="display:block;width:100%;height:auto;"></canvas>
          </div>
        </div>
        <div class="panel">
          <h3 id="yolo-count">Detections</h3>
          <table>
            <thead>
              <tr>
                <th>Class</th>
                <th>Confidence</th>
                <th>BBox [x, y, w, h]</th>
              </tr>
            </thead>
            <tbody id="yolo-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="page" id="page-nima">
      <h2>NIMA Score Test</h2>

      <div class="toolbar">
        <label class="upload-label">
          Select Image
          <input id="nima-input" type="file" accept="image/*" hidden />
        </label>
        <span class="file-name" id="nima-file-name"></span>
      </div>

      <p class="status" id="nima-status"></p>
      <div class="error" id="nima-error"></div>

      <div class="result-grid" id="nima-result">
        <div class="panel">
          <h3>Input Image</h3>
          <div class="image-frame">
            <img id="nima-img" src="" alt="NIMA input" />
          </div>
        </div>
        <div class="panel">
          <h3>NIMA Result</h3>
          <div class="score" id="nima-score">0.00</div>
          <div class="score-meta" id="nima-device"></div>
        </div>
      </div>
    </section>

    <section class="page" id="page-samp">
      <h2>SAMP Score Test — 구도(composition) 점수</h2>

      <div class="toolbar">
        <label class="upload-label">
          Select Image
          <input id="samp-input" type="file" accept="image/*" hidden />
        </label>
        <span class="file-name" id="samp-file-name"></span>
      </div>

      <p class="status" id="samp-status"></p>
      <div class="error" id="samp-error"></div>

      <div class="result-grid" id="samp-result">
        <div class="panel">
          <h3>Input Image</h3>
          <div class="image-frame">
            <img id="samp-img" src="" alt="SAMP input" />
          </div>
        </div>
        <div class="panel">
          <h3>SAMP Result</h3>
          <div class="score" id="samp-score">0.00</div>
          <div class="score-meta" id="samp-device"></div>
          <div class="score-meta" id="samp-dominant" style="margin-top:8px;"></div>
          <div id="samp-detail" style="margin-top:14px;"></div>
        </div>
      </div>
    </section>

    <section class="page" id="page-kakao-map">
      <h2>Kakao Map — 주변 관광명소</h2>

      <div class="toolbar" style="flex-wrap:wrap;gap:8px;">
        <button id="kakao-geolocate" style="padding:0 14px;height:40px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;">현재 위치</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;">
          위도 <input id="kakao-lat" type="number" step="any" value="36.076" style="width:110px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" />
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;">
          경도 <input id="kakao-lng" type="number" step="any" value="129.5665" style="width:110px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" />
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;">
          반경 <input id="kakao-radius" type="number" value="1000" min="100" max="20000" style="width:80px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;" /> m
        </label>
        <button id="kakao-search" class="upload-label" style="cursor:pointer;border:0;">검색</button>
      </div>

      <p class="status" id="kakao-status"></p>
      <div class="error" id="kakao-error"></div>

      <div id="kakao-map-container" style="width:100%;height:520px;margin-top:16px;border:1px solid #dde3ed;border-radius:8px;background:#f3f4f6;overflow:hidden;"></div>

      <div id="kakao-list-wrap" style="display:none;margin-top:20px;">
        <h3 id="kakao-list-title" style="margin-bottom:12px;color:#374151;font-size:15px;font-weight:700;">주변 관광명소</h3>
        <div class="panel" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr>
                <th style="padding:8px 12px;background:#eef4ff;border:1px solid #dbe1ea;text-align:left;">#</th>
                <th style="padding:8px 12px;background:#eef4ff;border:1px solid #dbe1ea;text-align:left;">장소명</th>
                <th style="padding:8px 12px;background:#eef4ff;border:1px solid #dbe1ea;text-align:left;">거리</th>
                <th style="padding:8px 12px;background:#eef4ff;border:1px solid #dbe1ea;text-align:left;">주소</th>
              </tr>
            </thead>
            <tbody id="kakao-list-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="page" id="page-captures">
      <h2>Drone — 세션 로그</h2>

      <div class="toolbar" style="gap:8px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#374151;">
          세션
          <select id="captures-select" style="min-width:260px;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
            <option value="">— 선택 —</option>
          </select>
        </label>
        <button id="captures-refresh" style="padding:0 14px;height:40px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;">새로고침</button>
      </div>

      <p class="status" id="captures-status"></p>
      <div class="error" id="captures-error"></div>

      <div id="captures-detail" style="display:none;">
        <div id="captures-nima" class="panel" style="margin-bottom:16px;"></div>
        <div id="captures-menu" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"></div>
        <div id="captures-content"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
